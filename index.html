<style>
  :root {
    --ink: #2B1810;
    --paper: #FAF6F0;
    --paper-2: #F4ECE0;
    --maple: #A8341A;
    --maple-deep: #6B1F0E;
    --amber: #D97706;
    --amber-soft: #F4C99F;
    --moss: #4A6741;
    --cream: #F8E9D0;
    --warm-white: #FFFBF5;
    --line: #E7E0D6;
  }
  html { scroll-behavior: smooth; scrollbar-gutter: stable; }
  html, body { overflow-x: hidden; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .font-serif { font-family: 'Fraunces', Georgia, serif; font-variation-settings: "opsz" 144; }
  h1, h2, h3, p { text-wrap: pretty; }
  ::selection { background: #F4C99F; color: var(--maple-deep); }

  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1); }
  .reveal.in { opacity: 1; transform: translateY(0); }
  .lift { transition: transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s ease, border-color .35s ease; }
  .lift:hover { transform: translateY(-4px); box-shadow: 0 18px 36px -22px rgba(43,24,16,.22); }

  /* Falling maple samaras */
  @keyframes mapleFall {
    0%   { transform: translate(0, -10vh); opacity: 0; }
    10%  { opacity: .6; }
    90%  { opacity: .6; }
    100% { transform: translate(var(--dx, 0), 110vh); opacity: 0; }
  }
  @keyframes mapleHeli {
    from { transform: perspective(600px) rotateZ(var(--tilt, 22deg)) rotateY(0deg); }
    to   { transform: perspective(600px) rotateZ(var(--tilt, 22deg)) rotateY(360deg); }
  }
  .maple-fall { animation: mapleFall var(--dur, 24s) linear infinite; animation-delay: var(--delay, 0s); }
  .maple-spin { display: inline-block; animation: mapleHeli var(--spin, 1.1s) linear infinite; }

  @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  .sway { transform-origin: bottom center; animation: sway 7s ease-in-out infinite; }

  .grain { position: relative; }
  .grain::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(43,24,16,0.04) 1px, transparent 1px);
    background-size: 3px 3px; mix-blend-mode: multiply;
  }

  .underline-grow {
    background-image: linear-gradient(currentColor, currentColor);
    background-size: 0 1px; background-position: 0 100%; background-repeat: no-repeat;
    transition: background-size .4s ease;
  }
  .underline-grow:hover { background-size: 100% 1px; }

  @keyframes softPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(168,52,26,0.55); }
    50% { box-shadow: 0 0 0 7px rgba(168,52,26,0); }
  }
  .pulse-dot { animation: softPulse 2.4s ease-in-out infinite; }

  /* Source lines under definitions and evidence */
  .source a { color: #78716c; }
  .source a:hover { color: var(--maple); }

  /* Flip cards */
  .flip { perspective: 1200px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .flip:focus-visible { outline: 2px solid var(--maple); outline-offset: 4px; border-radius: 24px; }
  .flip-inner { display: grid; height: 100%; transform-style: preserve-3d; transition: transform .65s cubic-bezier(.2,.7,.2,1); }
  .flip.is-flipped .flip-inner { transform: rotateY(180deg); }
  @media (hover: hover) { .flip:hover .flip-inner { transform: rotateY(180deg); } }
  .flip-face { grid-area: 1 / 1; min-height: 232px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .flip-back { transform: rotateY(180deg); }

  @media (prefers-reduced-motion: reduce) {
    .maple-fall, .maple-spin, .sway, .pulse-dot { animation: none; }
    .reveal { opacity: 1; transform: none; transition: none; }
    .flip-inner { transition: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useEffect, useState } = React;

/* ---------- Links used in more than one place ---------- */
const DHCS_CHW = "https://www.dhcs.ca.gov/providers-partners/frequently-asked-questions-for-medi-cal-community-health-worker-services-provider-requirements/";
const HHS_HUBS = "https://aspe.hhs.gov/sites/default/files/documents/81ff88859954186802b85137a61f412d/health-social-care-coordination.pdf";

/* ---------- Reveal-on-scroll ---------- */
function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll(".reveal");
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.08 });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
}

/* ---------- Maple samara icon (uses brand mask asset) ---------- */
const MapleLeaf = ({ size = 32, color = "var(--maple)", className = "" }) => (
  <span
    role="img"
    aria-hidden="true"
    className={className}
    style={{
      display: "inline-block",
      width: size,
      height: size,
      backgroundColor: color,
      WebkitMaskImage: "url('assets/maple-icon.png')",
      maskImage: "url('assets/maple-icon.png')",
      WebkitMaskRepeat: "no-repeat",
      maskRepeat: "no-repeat",
      WebkitMaskPosition: "center",
      maskPosition: "center",
      WebkitMaskSize: "contain",
      maskSize: "contain",
    }}
  />
);

/* ---------- Logo lockup ---------- */
const Logo = ({ size = 34, dark = false }) => (
  <div className="inline-flex items-center gap-2.5">
    <span className="sway inline-block"><MapleLeaf size={size} color={dark ? "var(--cream)" : "var(--maple)"}/></span>
    <span className="font-bold lowercase" style={{ fontFamily: "'Inter', system-ui, sans-serif", fontWeight: 700, fontSize: size*0.7, color: dark ? "#fff" : "var(--ink)", lineHeight: 1, letterSpacing: "-0.01em" }}>maple<sup style={{ fontSize: "0.5em", verticalAlign: "super", letterSpacing: 0 }}>™</sup></span>
  </div>
);

/* ---------- Shared bits ---------- */
const Label = ({ children, color = "var(--maple)" }) => (
  <span className="text-[10px] font-bold uppercase tracking-[0.28em]" style={{ color }}>{children}</span>
);

const Ext = ({ href, children, className = "", style }) => (
  <a href={href} target="_blank" rel="noopener" className={className} style={style}>{children}</a>
);

const ArrowOut = () => (
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>
);

const Icons = {
  chat:   <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>,
  compass:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>,
  list:   <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>,
  people: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
  home:   <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
  basket: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>,
  cal:    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>,
  heart:  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>,
};

/* ---------- Falling leaves (hero only) ---------- */
const FallingLeaves = () => {
  const leaves = Array.from({length: 8}).map((_, i) => ({
    left: (i * 47 + 7) % 95,
    delay: -(i * 3 + (i % 3) * 2),
    dur: 14 + (i % 4) * 3,
    dx: ((i * 41) % 60) - 30 + "vw",
    size: 18 + (i % 3) * 8,
    color: ["var(--maple)", "var(--amber)", "var(--maple-deep)", "var(--amber-soft)"][i % 4],
    spin: (0.85 + (i % 4) * 0.18).toFixed(2),
    tilt: 16 + (i % 3) * 7,
  }));
  return (
    <div className="absolute inset-0 pointer-events-none z-[1] overflow-hidden" aria-hidden="true">
      {leaves.map((l, i) => (
        <span key={i} className="absolute maple-fall" style={{ left: l.left+"%", top: 0, "--dur": l.dur+"s", "--delay": l.delay+"s", "--dx": l.dx, animationDelay: l.delay+"s" }}>
          <span className="maple-spin" style={{ "--spin": l.spin+"s", "--tilt": l.tilt+"deg", animationDelay: l.delay+"s" }}>
            <MapleLeaf size={l.size} color={l.color}/>
          </span>
        </span>
      ))}
    </div>
  );
};

/* ---------- Nav ---------- */
function Nav() {
  const [scrolled, setScrolled] = useState(false);
  const [open, setOpen] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 30);
    window.addEventListener("scroll", onScroll);
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  const links = [
    ["#care", "Community care"],
    ["#supported", "Community-supported"],
    ["#partners", "Community partners"],
  ];
  return (
    <nav className={`fixed w-full z-50 transition-all ${scrolled || open ? "bg-white/90 backdrop-blur-md border-b border-stone-200/70 py-3" : "bg-transparent py-5"}`}>
      <div className="max-w-7xl mx-auto px-6 flex justify-between items-center gap-6">
        <a href="#top" className="flex items-center gap-3">
          <Logo size={34}/>
          <span className="hidden xl:inline-block h-6 w-px" style={{ background: "#D6CFC4" }} aria-hidden="true"></span>
          <span className="hidden xl:inline font-serif font-bold lowercase" style={{ fontSize: 21, color: "var(--ink)", letterSpacing: "-0.02em", lineHeight: 1 }}>we all need <span style={{ color: "var(--maple)" }}>community.</span></span>
        </a>
        <div className="hidden lg:flex items-center gap-7 text-sm font-medium whitespace-nowrap" style={{ color: "var(--ink)" }}>
          {links.map(([href, label]) => <a key={href} href={href} className="hover:opacity-70">{label}</a>)}
        </div>
        <div className="flex items-center gap-2">
          <a href="#contact" className="text-white text-sm font-semibold px-4 py-2 rounded-full whitespace-nowrap" style={{ background: "var(--maple-deep)" }}>Get in touch</a>
          <button type="button" onClick={() => setOpen(v => !v)} aria-expanded={open} aria-controls="mobile-menu" aria-label={open ? "Close menu" : "Open menu"} className="lg:hidden w-10 h-10 rounded-full flex items-center justify-center" style={{ color: "var(--ink)", border: "1px solid rgba(43,24,16,0.2)", background: "rgba(255,255,255,0.7)" }}>
            {open
              ? <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
              : <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>}
          </button>
        </div>
      </div>
      {open && (
        <div id="mobile-menu" className="lg:hidden max-w-7xl mx-auto px-6 pt-3 pb-5 flex flex-col text-[15px] font-medium" style={{ color: "var(--ink)" }}>
          {links.map(([href, label]) => <a key={href} href={href} onClick={() => setOpen(false)} className="py-3" style={{ borderTop: "1px solid rgba(43,24,16,0.08)" }}>{label}</a>)}
        </div>
      )}
    </nav>
  );
}

/* ---------- Hero with the three-part index ---------- */
function Hero() {
  const rows = [
    ["#care", "community ", "care", "Medical care and community health work, delivered as one team."],
    ["#supported", "community-", "supported", "Health plans cover care for eligible members. Neighbors who can pay help cover those who can't."],
    ["#partners", "community ", "partners", "We work with community organizations, clinics, hospitals, and health plans to reach people where they are."],
  ];
  return (
    <section id="top" className="px-6 pt-36 pb-10 relative overflow-hidden">
      <div className="absolute inset-0 pointer-events-none" style={{ background: "radial-gradient(ellipse 60% 45% at 20% 0%, rgba(244,201,159,0.45), transparent 70%)" }}></div>
      <FallingLeaves/>
      <div className="max-w-7xl mx-auto relative" style={{ zIndex: 2 }}>
        <div className="reveal max-w-4xl">
          <h1 className="font-serif font-bold leading-[0.98] tracking-tight" style={{ color: "var(--ink)", fontSize: "clamp(44px, 7vw, 96px)" }}>
            Whole-person care for the <span style={{ color: "var(--maple)" }}>whole community.</span>
          </h1>
          <div style={{ width: 32, height: 3, background: "var(--maple)", marginTop: 28 }}></div>
          <p className="mt-7 text-lg md:text-xl text-stone-700 leading-relaxed max-w-xl">At Maple, clinicians and community health workers coordinate the care people need to recover and live well.</p>
        </div>
        <div className="reveal mt-20" style={{ borderTop: "1px solid rgba(43,24,16,0.12)" }}>
          {rows.map(([href, a, b, text]) => (
            <a key={href} href={href} className="group grid md:grid-cols-2 gap-2 md:gap-10 py-7 items-center" style={{ borderBottom: "1px solid rgba(43,24,16,0.12)" }}>
              <span className="font-serif font-bold lowercase leading-none" style={{ fontSize: "clamp(28px, 3.2vw, 40px)", color: "var(--ink)" }}>{a}<span style={{ color: "var(--maple)" }}>{b}</span></span>
              <span className="text-[17px] leading-relaxed text-stone-700">{text} <span className="inline-block transition-transform group-hover:translate-x-1" style={{ color: "var(--maple)" }} aria-hidden="true">→</span></span>
            </a>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ---------- Flip card: plain front, detail on the back ---------- */
function FlipCard({ icon, title, front, back, tone = "paper" }) {
  const [flipped, setFlipped] = useState(false);
  return (
    <button
      type="button"
      aria-pressed={flipped}
      aria-label={`${title}. ${flipped ? back : front} Activate to ${flipped ? "show less" : "show more"}.`}
      onClick={() => setFlipped(v => !v)}
      className={`flip text-left w-full h-full ${flipped ? "is-flipped" : ""}`}
    >
      <div className="flip-inner">
        <div className="flip-face rounded-3xl p-6 flex flex-col" style={{ background: tone === "white" ? "#fff" : "var(--paper-2)" }}>
          <div style={{ color: "var(--ink)", display: "flex" }}>{icon}</div>
          <p className="mt-auto pt-10 leading-snug" style={{ fontSize: "clamp(18px, 1.7vw, 21px)", fontWeight: 400, color: "var(--ink)" }}>{front}</p>
        </div>
        <div className="flip-face flip-back rounded-3xl p-6 flex flex-col" style={{ background: "var(--ink)", color: "#fff" }}>
          <span className="text-[11px] font-bold uppercase tracking-[0.18em]" style={{ color: "var(--amber-soft)" }}>{title}</span>
          <p className="text-[14.5px] leading-relaxed mt-3" style={{ color: "rgba(255,255,255,0.86)" }}>{back}</p>
          <span className="mt-auto text-[11px] font-bold uppercase tracking-[0.18em]" style={{ color: "rgba(255,255,255,0.45)" }}>Back</span>
        </div>
      </div>
    </button>
  );
}

/* ---------- Disclosure: a pop-out row ---------- */
function Disclosure({ title, children }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ borderTop: "1px solid rgba(43,24,16,0.12)" }}>
      <button type="button" aria-expanded={open} onClick={() => setOpen(v => !v)} className="w-full flex items-center justify-between gap-4 py-5 text-left">
        <span className="font-semibold text-[16px]" style={{ color: "var(--ink)" }}>{title}</span>
        <span aria-hidden="true" className="shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-lg leading-none" style={{ border: "1px solid rgba(43,24,16,0.2)", color: "var(--ink)", transform: open ? "rotate(45deg)" : "none", transition: "transform .3s" }}>+</span>
      </button>
      {open && <div className="pb-6 md:pr-12">{children}</div>}
    </div>
  );
}

/* ---------- Community care ---------- */
function CommunityCare() {
  const wpc = {
    text: "Attending to the conditions people live in: food, housing, transportation, and the relationships and resources that shape health outside the clinic.",
    sources: [{ label: "U.S. Department of Health and Human Services · Healthy People 2030", href: "https://health.gov/healthypeople/priority-areas/social-determinants-health" }],
  };
  const chw = {
    text: "A trusted member of the community that acts as a bridge connecting neighbors to medical and social care, under the supervision of a licensed provider.",
    sources: [
      { label: "American Public Health Association", href: "https://www.apha.org/apha-communities/member-sections/community-health-workers" },
      { label: "California Department of Health Care Services · Medi-Cal CHW benefit", href: DHCS_CHW },
    ],
  };
  const dayToDay = [
    { icon: Icons.home,   title: "Housing",        front: "Find housing support, including transitional and permanent housing or shelters.",
      back: "Through our partnerships with community organizations, we guide you to transitional housing and shelter resources you can count on." },
    { icon: Icons.basket, title: "Food",           front: "Access groceries, meals, and nutrition.",
      back: "We work closely with food banks, community programs, and grocery delivery partners to bring healthy meals and groceries directly to you." },
    { icon: Icons.heart,  title: "Providers",      front: "Access clinical and mental health providers.",
      back: "You'll have access to a team of behavioral health specialists who can provide counseling, guidance, and support for your mental well-being." },
    { icon: Icons.cal,    title: "Between visits", front: "Between visits, Maple keeps you connected to care.",
      back: "Your care team makes it easy to see your doctor, with support for scheduling, rides to your visit, and help getting your medications refilled." },
  ];
  const services = [
    { icon: Icons.chat,    title: "Health education",      front: "Understand your conditions, your medications, and how to stay well.",
      back: "Your community health worker explains things in plain language, so you know what a diagnosis means, how to take your medications, and how to stay ahead of problems." },
    { icon: Icons.compass, title: "Health navigation",     front: "Find your way to the care, benefits, and services you need.",
      back: "Help understanding your coverage, accessing benefits you're eligible for, scheduling appointments, following through on referrals, and connecting with local programs." },
    { icon: Icons.list,    title: "Social health check",   front: "A regular check on how things are going.",
      back: "Simple check-ins on your health and everyday needs like food, housing, and transportation, so the right support is in place and your care team stays in the loop." },
    { icon: Icons.people,  title: "Support and advocacy",  front: "Someone in your corner, between visits.",
      back: "A familiar face who can come with you to appointments, follows up afterward, and checks in regularly." },
  ];
  const Def = ({ d }) => (
    <div>
      <p className="font-bold leading-snug" style={{ fontSize: 17, color: "var(--ink)" }}>{d.text}</p>
