  .lift { transition: transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s ease, border-color .35s ease; }
  .lift:hover { transform: translateY(-4px); box-shadow: 0 18px 36px -22px rgba(43,24,16,.22); }

  /* Falling maple samaras */
  @keyframes mapleFall {
    0%   { transform: translate(0, -10vh); opacity: 0; }
    10%  { opacity: .6; }
    90%  { opacity: .6; }
    100% { transform: translate(var(--dx, 0), 110vh); opacity: 0; }
  }
  @keyframes mapleHeli {
    from { transform: perspective(600px) rotateZ(var(--tilt, 22deg)) rotateY(0deg); }
    to   { transform: perspective(600px) rotateZ(var(--tilt, 22deg)) rotateY(360deg); }
  }
  .maple-fall { animation: mapleFall var(--dur, 24s) linear infinite; animation-delay: var(--delay, 0s); }
  .maple-spin { display: inline-block; animation: mapleHeli var(--spin, 1.1s) linear infinite; }

  @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  .sway { transform-origin: bottom center; animation: sway 7s ease-in-out infinite; }

  .grain { position: relative; }
  .grain::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(43,24,16,0.04) 1px, transparent 1px);
    background-size: 3px 3px; mix-blend-mode: multiply;

  .underline-grow:hover { background-size: 100% 1px; }

  @keyframes softPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(168,52,26,0.55); }
    50% { box-shadow: 0 0 0 7px rgba(168,52,26,0); }

<script type="text/babel">
const { useEffect, useState, useRef } = React;

/* ---------- Reveal-on-scroll ---------- */
function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll(".reveal");
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.08 });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
}

/* ---------- Maple samara icon (uses brand mask asset) ---------- */
const MapleLeaf = ({ size = 32, color = "var(--maple)", className = "" }) => (
  <span
    role="img"
    aria-hidden="true"
    className={className}
    style={{
      display: "inline-block",
      width: size,
      height: size,
      backgroundColor: color,
      WebkitMaskImage: "url('assets/maple-icon.png')",
      maskImage: "url('assets/maple-icon.png')",
      WebkitMaskRepeat: "no-repeat",
      maskRepeat: "no-repeat",
      WebkitMaskPosition: "center",
      maskPosition: "center",
      WebkitMaskSize: "contain",
      maskSize: "contain",
    }}
  />
);

/* ---------- Logo lockup ---------- */
const Logo = ({ size = 34, dark = false }) => (
  <div className="inline-flex items-center gap-2.5">
    <span className="sway inline-block"><MapleLeaf size={size} color={dark ? "var(--cream)" : "var(--maple)"}/></span>
    <span className="font-bold lowercase" style={{ fontFamily: "var(--logo-font, 'Inter', system-ui, sans-serif)", fontWeight: "var(--logo-weight, 700)", fontSize: size*0.7, color: dark ? "#fff" : "var(--ink)", lineHeight: 1, letterSpacing: "var(--logo-tracking, -0.01em)" }}>maple<sup style={{ fontSize: "0.5em", verticalAlign: "super", letterSpacing: 0 }}>™</sup></span>
  </div>
);

/* ---------- Falling leaves (hero only) ---------- */
const FallingLeaves = () => {
  const leaves = Array.from({length: 8}).map((_, i) => ({
    left: (i * 47 + 7) % 95,
    delay: -(i * 3 + (i % 3) * 2),
    dur: 14 + (i % 4) * 3,
    dx: ((i * 41) % 60) - 30 + "vw",
    size: 18 + (i % 3) * 8,
    color: ["var(--maple)", "var(--amber)", "var(--maple-deep)", "var(--amber-soft)"][i % 4],
    spin: (0.85 + (i % 4) * 0.18).toFixed(2),
    tilt: 16 + (i % 3) * 7,
  }));
  return (
    <div className="absolute inset-0 pointer-events-none z-[1] overflow-hidden" aria-hidden="true">
      {leaves.map((l, i) => (
        <span key={i} className="absolute maple-fall" style={{ left: l.left+"%", top: 0, "--dur": l.dur+"s", "--delay": l.delay+"s", "--dx": l.dx, animationDelay: l.delay+"s" }}>
          <span className="maple-spin" style={{ "--spin": l.spin+"s", "--tilt": l.tilt+"deg", animationDelay: l.delay+"s" }}>
            <MapleLeaf size={l.size} color={l.color}/>
          </span>
        </span>
      ))}
    </div>
  );
};

/* ---------- Nav ---------- */
function Nav() {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 30);
    window.addEventListener("scroll", onScroll);
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return (
    <nav className={`fixed w-full z-50 transition-all ${scrolled ? "bg-white/90 backdrop-blur-md border-b border-stone-200/70 py-3" : "bg-transparent py-5"}`}>
      <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
        <a href="#top"><Logo size={34}/></a>
        <div className="hidden md:flex items-center gap-7 text-sm font-medium" style={{ color: "var(--ink)" }}>
          <a href="#case" className="hover:opacity-70">The problem</a>
          <a href="#chw" className="hover:opacity-70">Community health work</a>
          <a href="#work" className="hover:opacity-70">What we do</a>
          <a href="#study" className="hover:opacity-70">Research</a>
          <a href="#who" className="hover:opacity-70">Who we are</a>
        </div>
        <a href="#contact" className="text-white text-sm font-semibold px-4 py-2 rounded-full" style={{ background: "var(--maple-deep)" }}>Get in touch</a>
      </div>
    </nav>
  );
}

/* ---------- Hero ---------- */
function Hero() {

      <div className="max-w-5xl mx-auto text-center relative reveal" style={{ zIndex: 2 }}>
        <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/80 backdrop-blur text-[10px] font-bold uppercase tracking-[0.24em] mb-9 border border-stone-200" style={{ color: "var(--maple-deep)" }}>
          <span className="w-1.5 h-1.5 rounded-full pulse-dot" style={{ background: "var(--maple)" }}></span>
          Maple Community Care Hub
        </div>

        <h1 className="font-serif font-bold lowercase tracking-tight leading-[0.95] mb-8" style={{ color: "var(--ink)", fontSize: "clamp(64px, 12vw, 176px)" }}>
          we all need <br/><span className="italic" style={{ color: "var(--maple)" }}>community</span>
        </h1>

        <p className="text-lg md:text-2xl text-stone-700 leading-relaxed max-w-2xl mx-auto mb-10 font-medium">
          We do community health work, and fund the people and organizations building healthy communities.
        </p>

        <div className="flex gap-3 justify-center flex-wrap">
          <a href="#work" className="text-white px-7 py-3.5 rounded-full font-semibold text-sm inline-flex items-center gap-2" style={{ background: "var(--maple-deep)" }}>
            Our work
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
          </a>
          <a href="#contact" className="px-7 py-3.5 rounded-full font-semibold text-sm border border-stone-300 bg-white/70 backdrop-blur" style={{ color: "var(--ink)" }}>Connect with us</a>
        </div>
      </div>

      {/* Tagline row — samara separators, matches poster footer */}
      <div className="mt-20 max-w-5xl mx-auto" aria-hidden="true">
        {/* Mobile: 2×2 grid, no separators */}
        <div className="grid grid-cols-2 gap-3 sm:hidden place-items-center">
          {["Connecting people", "Building trust", "Promoting well-being", "Strengthening communities"].map((label, i) => (
            <span key={i} className="tagline-item" style={{ padding: 0 }}>{label}</span>
          ))}
        </div>
        {/* Desktop: inline row with leaf separators */}
        <div className="hidden sm:flex items-center justify-center flex-wrap gap-y-3">
          {["Connecting people", "Building trust", "Promoting well-being", "Strengthening communities"].map((label, i) => (
            <React.Fragment key={i}>
              <span className="tagline-item">{label}</span>
              {i < 3 && <span className="inline-block mx-3 opacity-40"><MapleLeaf size={14} color="var(--maple)"/></span>}

      {/* Marquee */}
      <div className="mt-14 relative overflow-hidden" aria-hidden="true">
        <div className="flex marquee-track gap-10 whitespace-nowrap font-serif italic lowercase text-stone-400" style={{ fontSize: "clamp(26px, 4vw, 52px)" }}>
          {Array.from({length: 2}).map((_, k) => (
            <div key={k} className="flex gap-10 shrink-0">
              {["families", "neighbors", "clinics", "community health workers", "community-based organizations", "faith communities", "service clubs", "county agencies", "justice partners", "schools", "case managers"].map((w, i) => (
                <span key={i} className="inline-flex items-center gap-10">
                  {w}
                  <span className="text-[var(--maple)]" style={{ fontStyle: "normal" }}>·</span>

              ))}

}

/* ---------- The problem: disconnection ---------- */
function TheCase() {
  const stats = [
    { big: "74%", pct: 74, sub: "of Americans don't feel a strong sense of community.", src: "American Home Shield · Digital Third Coast" },
    { big: "13%", pct: 13, sub: "of Americans know their neighbors' names.", src: "American Home Shield · Digital Third Coast" },
    { big: "54%", pct: 54, sub: "of adults report feeling persistently isolated.", src: "American Psychological Association" },
  ];
  const illness = [
    { big: "15", viz: "cigs", sub: "Social disconnection is as deadly as smoking up to 15 cigarettes a day.", src: "U.S. Surgeon General's Advisory, 2023" },
    { big: "+50%", viz: "up", sub: "Higher risk of dementia — alongside higher risk of heart disease and stroke.", src: "U.S. Surgeon General's Advisory, 2023" },
    { big: "42%", pct: 42, sub: "of U.S. high schoolers feel persistently sad or hopeless — up about 50% in a decade.", src: "CDC, Youth Risk Behavior Survey" },
  ];
  const health = [
    { big: "≈70%", pct: 70, sub: "higher risk of hospitalization for socially isolated patients.", src: "Manemann et al., 2018" },
    { big: "6×", viz: "mult", n: 6, sub: "more likely to be reincarcerated with no visitors, versus those with three or more.", src: "California parolee study · Prison Policy Initiative" },
    { big: "$6.7B", viz: "cost", sub: "in extra Medicare spending every year, linked to social isolation among older adults.", src: "AARP Public Policy Institute" },
  ];
  const [showData, setShowData] = useState(false);

  const Stat = (s, i) => (
    <div key={i} className="rounded-3xl p-7 grain flex flex-col justify-between min-h-[250px]" style={{ background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.12)" }}>
      <div>
        <div className="font-serif font-bold leading-none" style={{ fontSize: "clamp(42px, 5vw, 66px)", color: "var(--amber-soft)" }}>{s.big}</div>
        {typeof s.pct === "number" && (
          <div className="mt-5 h-2.5 rounded-full overflow-hidden" style={{ background: "rgba(255,255,255,0.12)" }} aria-hidden="true">
            <div className="h-full rounded-full" style={{ width: s.pct + "%", background: "var(--amber-soft)" }}></div>
          </div>
        )}
        {s.viz === "cigs" && (
          <div className="flex gap-[4px] mt-5" aria-hidden="true">
            {Array.from({length: 15}).map((_, k) => (<span key={k} style={{ width: "5px", height: "26px", borderRadius: "1px", background: k < 14 ? "#F4C99F" : "var(--maple)", opacity: 0.85 }}></span>))}
          </div>
        )}
        {s.viz === "mult" && (
          <div className="flex gap-1.5 mt-5" aria-hidden="true">
            {Array.from({length: s.n}).map((_, k) => (<span key={k} style={{ width: "12px", height: "26px", borderRadius: "3px", background: "var(--amber-soft)", opacity: 0.32 + k * 0.12 }}></span>))}
          </div>
        )}
        {s.viz === "up" && (
          <div className="mt-5" aria-hidden="true"><svg width="50" height="28" viewBox="0 0 50 28" fill="none" stroke="var(--amber-soft)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2 26 L18 14 L30 19 L48 3"/><path d="M37 3 L48 3 L48 14"/></svg></div>
        )}
      </div>
      <div className="mt-5">
        <p className="text-[14px] leading-snug text-stone-200">{s.sub}</p>
        <div className="text-[10px] uppercase tracking-[0.16em] font-bold text-stone-500 mt-3">{s.src}</div>
      </div>
    </div>
  );

  const chapters = [
    { lead: "First — ", hi: "we pulled apart.", data: stats },
    { lead: "Then — ", hi: "it started making us sick.", data: illness },
    { lead: "And it landed in our most expensive, least humane places — ", hi: "hospitals and jails.", data: health },
  ];

  return (
    <section id="case" className="py-20 px-6 relative overflow-hidden" style={{ background: "var(--ink)", color: "#fff" }}>
      <div className="absolute -top-24 -right-24 opacity-[0.05] pointer-events-none">
        <MapleLeaf size={420} color="#F4C99F"/>
      </div>
      <div className="max-w-7xl mx-auto relative">
        <div className="reveal max-w-3xl mb-14">
          <span className="text-[10px] font-bold uppercase tracking-[0.28em]" style={{ color: "var(--amber-soft)" }}>The problem</span>
          <h2 className="font-serif font-bold lowercase mt-5 leading-[0.95] tracking-tight" style={{ fontSize: "clamp(40px, 6vw, 76px)" }}>
            we are more <span className="italic" style={{ color: "var(--amber-soft)" }}>disconnected than ever.</span>
          </h2>
          <p className="mt-7 text-lg leading-relaxed font-medium text-stone-300">
            This disconnection shows up across every layer of community: the people next door, the dinner table, the classroom, the clubs and congregations we used to join. It's making us sicker and overloading our most expensive and least humane settings — hospitals and jails.
          </p>
        </div>

        <div className="reveal flex justify-center">
          <button type="button" onClick={() => setShowData(v => !v)} className="inline-flex items-center gap-2 px-6 py-3 rounded-full font-semibold text-sm border transition" style={{ borderColor: "rgba(244,201,159,0.45)", color: "var(--amber-soft)", background: showData ? "rgba(244,201,159,0.08)" : "transparent" }}>
            {showData ? "Hide the data" : "See the data"}
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" style={{ transform: showData ? "rotate(180deg)" : "none", transition: "transform .3s" }}><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>

        {showData && (
        <div className="mt-16 space-y-16">
          {chapters.map((ch, ci) => (
            <div key={ci}>
              <p className="font-serif leading-snug max-w-3xl mb-8" style={{ fontSize: "clamp(26px, 3.6vw, 44px)" }}>
                {ch.lead}<span className="italic" style={{ color: "var(--amber-soft)" }}>{ch.hi}</span>
              </p>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                {ch.data.map((s, i) => Stat(s, i))}
              </div>
            </div>
          ))}
        </div>
        )}
      </div>
    </section>
  );
}

/* ---------- Community Health Work section — poster layout ---------- */
function CHWSection() {
  const actions = [
    {
      icon: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>,
      title: "Navigate",
      body: "appointments, insurance, and social services",
      color: "var(--ink)",
    },
    {
      icon: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>,
      title: "Provide",
      body: "health education in plain language",
      color: "#A8341A",
    },
    {

              { src: "Flowers et al. · AARP Public Policy Institute, 2017", title: "Medicare Spends More on Socially Isolated Older Adults", take: "Isolation is tied to about $6.7 billion in extra Medicare spending each year." },
              { src: "Klinenberg · 2002", title: "Heat Wave: A Social Autopsy of Disaster in Chicago", take: "In a deadly heat wave, better-connected neighborhoods lost far fewer lives." },
              { src: "Cacioppo & Patrick · 2008", title: "Loneliness: Human Nature and the Need for Social Connection", take: "Loneliness reshapes the body — stress hormones, immunity, sleep, and the heart." },
              { src: "Christakis & Fowler · NEJM, 2007", title: "The Spread of Obesity in a Large Social Network", take: "Health ripples through social networks — we quietly shape each other." },
              { src: "Dean Ornish · 1998", title: "Love & Survival: The Healing Power of Intimacy", take: "A physician's synthesis of the evidence that connection itself is medicine." },
            ].map((s, i) => (
              <a key={i} href={s.href || ("https://scholar.google.com/scholar?q=" + encodeURIComponent(s.title))} target="_blank" rel="noopener" className="snap-start shrink-0 rounded-2xl p-6 flex flex-col" style={{ width: 300, background: "rgba(255,255,255,0.75)", borderLeft: "3px solid rgba(168,52,26,0.45)", borderTop: "1px solid rgba(43,24,16,0.08)", borderRight: "1px solid rgba(43,24,16,0.08)", borderBottom: "1px solid rgba(43,24,16,0.08)" }}>
                <div className="text-[10px] font-bold uppercase tracking-[0.16em] text-stone-500 mb-3">{s.src}</div>
                <div className="font-serif leading-snug flex-1" style={{ fontSize: "17px", color: "var(--ink)" }}>{s.title}</div>
                <p className="text-[13px] leading-relaxed text-stone-600 mt-3 mb-4">{s.take}</p>
                <span className="inline-flex items-center gap-1.5 text-[12px] font-semibold" style={{ color: "var(--maple)" }}>Read the study <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M7 17 17 7M7 7h10v10"/></svg></span>
              </a>
            ))}
            <div className="shrink-0" style={{ width: 1 }}></div>
          </div>
        </div>
      </div>
    </section>
  );
}
